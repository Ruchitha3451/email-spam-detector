<!DOCTYPE html>
<html>
<head>
    <title>Email Spam Detection</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 400px;
            width: 100%;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        #result {
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>
    <h3>Email Spam Checker</h3>
    <textarea id="emailInput" placeholder="Enter email content here..."></textarea>
    <button id="checkBtn">Check Spam</button>
    <div id="result"></div>

    <script src="popup.js"></script>
</body>
</html>
